version: 2

sources:
  - name: raw
    description: Dados brutos gerados pelo script scripts/generate_data.py.
    schema: public
    tables:
      - name: users_info
        description: Cadastro de pessoas, exatamente como gerado na origem.
        columns:
          - name: id
            description: Chave primária (SERIAL).
            data_tests:
              - unique
              - not_null
          - name: email
            description: E-mail da pessoa (restrição UNIQUE na origem).
            data_tests:
              - unique
              - not_null
