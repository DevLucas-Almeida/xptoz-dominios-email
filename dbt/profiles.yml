# Perfil de conexão do dbt. Nenhuma credencial fica no arquivo:
# todos os valores vêm das variáveis PG_* definidas no .env.
xptoz:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('PG_HOST') }}"
      port: "{{ env_var('PG_PORT', '5432') | as_number }}"
      user: "{{ env_var('PG_USER') }}"
      password: "{{ env_var('PG_PASSWORD') }}"
      dbname: "{{ env_var('PG_DBNAME') }}"
      schema: public
      sslmode: "{{ env_var('PG_SSLMODE', 'prefer') }}"
      threads: 4
      connect_timeout: 15
